[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-agency-os"
version = "0.3.0"
description = "Contract and validation foundation for the SEO Agency Operating System"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
seo-os-privacy-check = "seo_os.security.scan:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
